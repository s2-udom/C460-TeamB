schemaVersion: "2.2"
description: "Deploy or roll back the ticketing app container on this host. It only runs the fixed script below, so callers cannot run arbitrary commands."
parameters:
  action:
    type: String
    description: "deploy a new image, or rollback to the previous one."
    default: deploy
    allowedValues:
      - deploy
      - rollback
  imageUri:
    type: String
    description: "Full ECR image URI including the tag. Not needed for rollback."
    default: ""
    allowedPattern: '^$|^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9][a-z0-9._/-]*:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      timeoutSeconds: "900"
      runCommand:
        - |
          ACTION='{{ action }}'
          IMAGE_PARAM='{{ imageUri }}'
          STATE=/opt/ticketing
          NAME=app
          ENVFILE=$STATE/app.env

          if [ "$ACTION" = "rollback" ]; then
            TARGET=$(cat "$STATE/previous-image" 2>/dev/null)
            if [ -z "$TARGET" ]; then echo "No previous image recorded, cannot roll back"; exit 1; fi
          else
            TARGET=$IMAGE_PARAM
            if [ -z "$TARGET" ]; then echo "imageUri is required for deploy"; exit 1; fi
          fi

          REGISTRY=${TARGET%%/*}
          REGION=$(echo "$REGISTRY" | cut -d. -f4)
          echo "== $ACTION: $TARGET (region $REGION)"

          # What is running now? Needed to roll back if the new image does not come up.
          CURRENT=$(cat "$STATE/current-image" 2>/dev/null)
          if [ -z "$CURRENT" ]; then
            CURRENT=$(docker inspect "$NAME" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Config"]["Image"])' 2>/dev/null)
          fi

          # RDS rotates the database password every 7 days, so rebuild DATABASE_URL on every deploy.
          /usr/local/bin/refresh-app-env || { echo "could not refresh DATABASE_URL"; exit 1; }

          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null || { echo "ECR login failed"; exit 1; }
          docker pull "$TARGET" >/dev/null || { echo "could not pull $TARGET"; exit 1; }

          start_app() {
            docker rm -f "$NAME" >/dev/null 2>&1
            docker run -d --name "$NAME" --restart unless-stopped -p 80:5000 --env-file "$ENVFILE" "$1" >/dev/null || return 1
            n=0
            while [ "$n" -lt 30 ]; do
              if [ -z "$(docker ps -q --filter "name=^${NAME}$" --filter status=running)" ]; then return 1; fi
              if curl -fsS --max-time 3 http://127.0.0.1/healthz >/dev/null 2>&1; then return 0; fi
              n=$((n+1))
              sleep 2
            done
            return 1
          }

          if start_app "$TARGET"; then
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$TARGET" ]; then echo "$CURRENT" > "$STATE/previous-image"; fi
            echo "$TARGET" > "$STATE/current-image"
            docker image prune -f >/dev/null 2>&1
            echo "== OK: $TARGET is running"
            echo "readyz: $(curl -s --max-time 5 http://127.0.0.1/readyz)"
            exit 0
          fi

          echo "== FAILED to start $TARGET. Last log lines:"
          docker logs --tail 40 "$NAME" 2>&1
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$TARGET" ]; then
            echo "== Restoring $CURRENT"
            if start_app "$CURRENT"; then echo "== Restored $CURRENT"; else echo "== Restore ALSO FAILED"; fi
          fi
          exit 1
