auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Local development: allow the collector to upload the existing project
# container log backlog once, without rejecting entries older than the default
# two-hour out-of-order window.
ingester:
  max_chunk_age: 48h

ruler:
  alertmanager_url: http://alertmanager:9093
