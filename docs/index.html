<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ushr — Ticketing prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#F4F3EE; --ink:#141416; --muted:#5E5E66; --line:#DAD8D0; --field:#CFCDC4;
  --orange:#FF5B22; --orange-soft:#FF8A5E; --white:#FFFFFF; --dark-line:#3A3A40; --dark-muted:#A9A7A0;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:Inter,system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{max-width:1360px;margin:0 auto;padding:40px}
.row{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.grow{flex:999 1 560px;min-width:0}
.side{flex:1 1 340px;max-width:420px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:18px 40px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo span{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.nav{display:flex;gap:4px;flex:1 1 auto;flex-wrap:wrap}
.nav a{padding:10px 16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px}
.nav a.on{background:var(--ink);color:var(--paper);font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--white);display:flex;align-items:center;justify-content:center}
.back{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;text-decoration:none;padding:10px 4px}
.spacer{flex:1 1 auto}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.steps li{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--field);color:var(--muted)}
.steps li.done{border-color:var(--ink);color:var(--ink);font-weight:500}
.steps li.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 22px;border-radius:14px;border:0;text-decoration:none;font-weight:700;font-size:16px}
.btn-ink{background:var(--ink);color:var(--paper)} .btn-ink:hover{color:var(--paper);opacity:.9}
.btn-orange{background:var(--orange);color:var(--ink)} .btn-orange:hover{color:var(--ink);filter:brightness(1.05)}
.btn-line{border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}
.btn-off{background:#2A2A2F;color:#8E8C85;cursor:not-allowed}
.block{display:flex;width:100%}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:600}
.input{height:52px;padding:0 16px;border:1.5px solid var(--field);border-radius:12px;background:var(--white);font:inherit;font-size:16px;color:var(--ink)}
textarea.input{height:auto;padding:14px 16px;resize:vertical}
.card{background:var(--white);border-radius:20px;padding:28px}
.dark{background:var(--ink);color:var(--paper);border-radius:24px;padding:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.pills{display:flex;padding:4px;background:#E8E6DF;border-radius:999px}
.pills button{flex:1;height:44px;padding:0 22px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500;font-size:15px}
.pills button.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,20,22,.12)}
.tag{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.12em;padding:6px 10px;border-radius:6px}

/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login-art{flex:1 1 520px;min-height:560px;background:var(--orange);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:48px;position:relative;overflow:hidden}
.login-art h1{font-weight:800;font-size:clamp(64px,8vw,104px);line-height:.9;letter-spacing:-.04em}
.login-form{flex:1 1 520px;display:flex;align-items:center;justify-content:center;padding:48px 32px}
.login-form>div{width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px}
.circle{position:absolute;border-radius:50%}
.stub{display:flex;max-width:460px;background:var(--ink);color:var(--paper);border-radius:14px;position:relative;z-index:1}

/* home */
.hero-title{font-weight:800;font-size:clamp(44px,6vw,72px);line-height:.95;letter-spacing:-.035em;max-width:900px}
.search{display:flex;flex-wrap:wrap;background:var(--white);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;max-width:980px}
.search>div{display:flex;flex-direction:column;padding:12px 20px;border-right:1px solid var(--line)}
.search label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.search input,.search select{border:0;padding:4px 0 0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
.chip{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--field);background:var(--white);font-weight:500;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.feature{display:flex;flex-wrap:wrap;text-decoration:none;color:var(--paper);background:var(--ink);border-radius:24px;overflow:hidden}
.feature:hover{color:var(--paper)}
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 24px}
.ev{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.poster{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden}
.poster .mark{position:absolute;left:20px;bottom:12px;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.04em}

/* event */
.event-hero{position:relative;min-height:420px;border-radius:28px;overflow:hidden;background:var(--orange);display:flex;align-items:flex-end;padding:48px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.fact{background:var(--white);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.fact span:first-child{font-size:13px;color:var(--muted);font-weight:600}
.fact span:last-child{font-family:var(--display);font-weight:700;font-size:22px}
.tier{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:1.5px solid var(--dark-line);border-radius:14px}
.sw{width:14px;height:14px;border-radius:4px;flex:none;display:inline-block}
.know{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.know li{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;line-height:1.5}

/* seats */
.map{background:var(--white);border-radius:24px;padding:32px 24px 36px;overflow-x:auto}
.map-inner{min-width:820px;display:flex;flex-direction:column;align-items:center;gap:28px}
.stage{width:70%;height:54px;background:var(--ink);color:var(--paper);border-radius:0 0 50% 50%/0 0 100% 100%;display:flex;justify-content:center;padding-top:12px;font-family:var(--mono);font-size:13px;letter-spacing:.4em}
.srow{display:flex;align-items:center;gap:6px}
.rl{width:22px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seat{width:28px;height:28px;padding:0;border-radius:8px 8px 4px 4px;font-family:var(--mono);font-size:10px;display:flex;align-items:center;justify-content:center;background:var(--white);color:transparent;border:2.5px solid var(--c)}
.seat:hover{background:color-mix(in srgb,var(--c) 18%,white)}
.seat.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seat.sold{background:var(--field);border:0;cursor:not-allowed}
.seat.held{background:var(--paper);border:2px dashed #8E8C85;cursor:not-allowed}
.key{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:16px;font-size:14px}
.key li{display:flex;align-items:center;gap:8px}
.key i{width:18px;height:18px;border-radius:5px 5px 3px 3px;display:inline-block}
.pick{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--dark-line);border-radius:14px}
.x{width:44px;height:44px;border-radius:10px;border:0;background:#26262B;color:var(--paper);display:flex;align-items:center;justify-content:center}
.totals{margin:0;display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--dark-line);font-size:15px}
.totals div{display:flex;justify-content:space-between;align-items:baseline}
.totals dt{color:var(--dark-muted)} .totals dd{margin:0}
.big{font-family:var(--display);font-weight:800;font-size:32px}

/* checkout */
.banner{padding:14px 40px}
.banner .in{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
fieldset{margin:0;border:0}
legend{float:left;padding:0;margin-bottom:4px;font-family:var(--display);font-weight:700;font-size:24px}
legend+*{clear:both}
.note{margin:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#EEF2FF;color:#23347A;font-size:14px}

/* ticket */
.ticket{width:100%;max-width:900px;display:flex;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:26px;overflow:hidden;text-align:left}
.ticket dt{font-size:12px;color:var(--dark-muted);font-weight:600;letter-spacing:.04em}
.ticket dd{margin:4px 0 0;font-weight:600;font-size:17px}
.qr{display:grid;grid-template-columns:repeat(21,8px);grid-auto-rows:8px;background:var(--white);padding:14px;border-radius:14px}

/* tickets list */
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.tl li{display:flex;flex-wrap:wrap;background:var(--white);border-radius:20px;overflow:hidden}
.date{flex:0 0 120px;padding:18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.status{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}

/* admin */
.admin{min-height:100vh;display:flex;flex-wrap:wrap}
.admin-nav{flex:1 1 240px;max-width:280px;background:var(--ink);color:var(--paper);padding:24px 18px;display:flex;flex-direction:column;gap:28px}
.admin-nav ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.admin-nav a.item{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;color:#C9C7BF;text-decoration:none;font-size:15px}
.admin-nav a.item.on{background:var(--orange);color:var(--ink);font-weight:600}
table{width:100%;min-width:640px;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-size:13px;font-weight:600;padding:16px 20px;border-bottom:1px solid #E8E6DF}
td{padding:16px 20px;border-bottom:1px solid #F0EEE8}

/* prototype screen menu */
body{padding-bottom:84px}
#screens{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;max-width:calc(100vw - 24px);overflow-x:auto;padding:6px;background:rgba(20,20,22,.94);border-radius:999px;box-shadow:0 8px 24px rgba(20,20,22,.25)}
#screens span{font-size:11px;letter-spacing:.14em;color:#A9A7A0;padding:0 10px 0 12px;white-space:nowrap}
#screens button{flex:none;height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#F4F3EE;font-size:14px;font-weight:500;white-space:nowrap}
#screens button:hover{background:#2A2A2F}
#screens button.on{background:var(--orange);color:var(--ink);font-weight:700}

@media (max-width:700px){
  .top,.wrap{padding-left:20px;padding-right:20px}
  .search>div{border-right:0;border-bottom:1px solid var(--line);flex-basis:100%!important}
  .event-hero,.login-art{padding:28px}
}
</style>
</head>
<body>
<div id="app"></div>

<nav id="screens" aria-label="Prototype screens">
  <span class="mono">SCREENS</span>
  <button type="button" data-go="login">1 Sign in</button>
  <button type="button" data-go="home">2 Home</button>
  <button type="button" data-go="event">3 Event</button>
  <button type="button" data-go="seats">4 Seats</button>
  <button type="button" data-go="checkout">5 Checkout</button>
  <button type="button" data-go="confirmation">6 Ticket</button>
  <button type="button" data-go="tickets">7 My tickets</button>
  <button type="button" data-go="admin">8 Admin</button>
</nav>

<script>
/* ---------- data ---------- */
const EVENTS = [
  { id:'ns',  name:'Night Swim', cat:'Music', when:'Sat 14 Nov', venue:'The Foundry', price:22, mark:'NS', bg:'#2B48D6', fg:'#F4F3EE', sh:'circle' },
  { id:'pl',  name:'Paper Lanterns: a comedy hour', cat:'Comedy', when:'Sun 15 Nov', venue:'Old Tram Depot', price:15, mark:'PL', bg:'#F2D64B', fg:'#141416', sh:'bar' },
  { id:'gg',  name:'The Glass Garden', cat:'Theatre', when:'Wed 18 Nov', venue:'Canal Street Theatre', price:28, mark:'GG', bg:'#141416', fg:'#FF5B22', sh:'ring' },
  { id:'lto', name:'Low Tide Orchestra', cat:'Music', when:'Fri 20 Nov', venue:'Riverside Hall', price:25, mark:'LTO', bg:'#FF5B22', fg:'#141416', sh:'circle' },
  { id:'ee',  name:'East End Roller Derby', cat:'Sport', when:'Sat 21 Nov', venue:'Leyton Arena', price:12, mark:'EE', bg:'#7BC4A4', fg:'#141416', sh:'bar' },
  { id:'ss',  name:'Saturday Science Show', cat:'Family', when:'Sat 28 Nov', venue:'Riverside Hall', price:9, mark:'SS', bg:'#E9E3D3', fg:'#2B48D6', sh:'ring' },
  { id:'nst', name:'Northern Static', cat:'Music', when:'Thu 3 Dec', venue:'The Foundry', price:18, mark:'N/S', bg:'#141416', fg:'#F2D64B', sh:'bar' },
  { id:'vh',  name:'Velvet Hours Jazz Club', cat:'Music', when:'Fri 4 Dec', venue:'Basement 9', price:20, mark:'VH', bg:'#8A3B6E', fg:'#F4F3EE', sh:'circle' }
];
const TIERS = [
  { name:'Stalls',  price:45, color:'#FF5B22', rows:['A','B','C','D','E','F','G','H'], half:8,  note:'Rows A–H · best view' },
  { name:'Circle',  price:35, color:'#4C7BF0', rows:['J','K','L','M'], half:10, note:'Rows J–M · raised' },
  { name:'Balcony', price:25, color:'#D9B21F', rows:['N','O','P'], half:11, note:'Rows N–P · top tier' }
];
const FEE = 1.5, MAX = 6, HOLD_SECONDS = 600;

/* seat statuses are fixed so the map looks the same every time */
const SEATS = {};
(function buildSeats(){
  let ri = 0;
  TIERS.forEach(t => t.rows.forEach(r => {
    ri++;
    for (let n = 1; n <= t.half * 2; n++) {
      const sold = ((ri*13 + n*7) % 9 === 0) || ((ri*3 + n) % 11 === 0);
      const held = !sold && ((ri*5 + n*11) % 17 === 0);
      SEATS[r+'-'+n] = { row:r, num:n, tier:t, status: sold ? 'sold' : held ? 'held' : 'free' };
    }
  }));
})();

/* ---------- state ---------- */
const state = {
  authMode:'login', cat:'All', selected:['F-11','F-12'], limitHit:false,
  holdEnds:null, ticketsTab:'up', order:null
};
let timer = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const money = v => '£' + v.toFixed(2);
const ROUTES = ['login','home','event','seats','checkout','confirmation','tickets','admin'];
let currentRoute = (() => {
  try { const r = location.hash.replace('#/','').split('?')[0]; return ROUTES.includes(r) ? r : 'login'; } catch (e) { return 'login'; }
})();
const go = route => {
  currentRoute = ROUTES.includes(route) ? route : 'login';
  try { history.replaceState(null, '', '#/' + currentRoute); } catch (e) { /* some previews block this; navigation still works */ }
  render();
  try { scrollTo(0, 0); } catch (e) {}
};
const icon = {
  logo:(c='#FF5B22',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 7h22v4a3 3 0 0 0 0 6v4H3v-4a3 3 0 0 0 0-6z" fill="${c}"/></svg>`,
  arrow:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  back:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`,
  check:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`,
  user:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141416" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
  clock:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  search:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
  x:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`
};

function header(active){
  const link = (r,label) => `<a href="#/${r}" class="${active===r?'on':''}" ${active===r?'aria-current="page"':''}>${label}</a>`;
  return `<header class="top">
    <a class="logo" href="#/home">${icon.logo()}<span>ushr</span></a>
    <nav class="nav" aria-label="Main">${link('home','Events')}${link('tickets','My tickets')}${link('admin','Admin')}</nav>
    <a class="avatar" href="#/login" aria-label="Account">${icon.user}</a>
  </header>`;
}
function stepsHeader(step, backRoute, backLabel){
  const s = (i,label) => {
    const cls = i < step ? 'done' : i === step ? 'on' : '';
    const mark = i < step ? icon.check : `<span class="mono">${i}</span>`;
    return `<li class="${cls}" ${i===step?'aria-current="step"':''}>${mark}${label}</li>`;
  };
  return `<header class="top">
    <a class="logo" href="#/home">${icon.logo()}<span>ushr</span></a>
    ${backRoute ? `<a class="back" href="#/${backRoute}">${icon.back}${backLabel}</a>` : ''}
    <div class="spacer"></div>
    <ol class="steps" aria-label="Booking steps">${s(1,'Seats')}${s(2,'Checkout')}${s(3,'Ticket')}</ol>
  </header>`;
}
function posterShape(e){
  if (e.sh === 'circle') return `<div class="circle" style="right:-40px;top:-40px;width:180px;height:180px;background:${e.fg};opacity:.9"></div>`;
  if (e.sh === 'ring') return `<div class="circle" style="left:24px;top:24px;width:130px;height:130px;border:3px solid ${e.fg}"></div>`;
  return `<div style="position:absolute;left:0;right:0;top:46%;height:18px;background:${e.fg}"></div>`;
}
function selectedSeats(){ return state.selected.map(id => ({ id, ...SEATS[id] })); }
function totals(){
  const sub = selectedSeats().reduce((a,s)=>a+s.tier.price,0);
  const fee = state.selected.length * FEE;
  return { sub, fee, total: sub + fee };
}

/* ---------- pages ---------- */
const pages = {};

pages.login = () => {
  const login = state.authMode === 'login';
  return `<div class="login">
    <section class="login-art">
      <div class="logo">${icon.logo('#141416',30)}<span>ushr</span></div>
      <div style="position:relative;z-index:1">
        <h1>Your seat,<br>sorted.</h1>
        <p style="margin:24px 0 0;font-size:19px;line-height:1.5;max-width:420px">Find a night out, pick the exact seat you want, and have it held for you while you pay.</p>
      </div>
      <div class="circle" style="right:-60px;top:120px;width:340px;height:340px;border:2px solid #141416" aria-hidden="true"></div>
      <div class="circle" style="right:60px;top:240px;width:120px;height:120px;background:#141416" aria-hidden="true"></div>
      <div class="stub">
        <div style="flex:1;padding:20px 22px;display:flex;flex-direction:column;gap:6px">
          <span class="mono" style="font-size:12px;letter-spacing:.12em;color:var(--orange-soft)">ADMIT ONE</span>
          <span style="font-family:var(--display);font-weight:700;font-size:22px">Low Tide Orchestra</span>
          <span style="font-size:14px;color:#C9C7BF">Fri 20 Nov · Riverside Hall</span>

function qrCells(seed){
  const N = 21, out = [];
  const finder = (x,y) => {
    for (const [fx,fy] of [[0,0],[N-7,0],[0,N-7]]) {
      const dx=x-fx, dy=y-fy;
      if (dx>=0&&dx<7&&dy>=0&&dy<7) return (dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)) ? 1 : 0;
      if (dx>=-1&&dx<=7&&dy>=-1&&dy<=7) return 0;
    }
    return -1;
  };
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    const f = finder(x,y);
    const on = f===-1 ? ((x*31+y*17+x*y*7+seed)%7)<3 : f===1;
    out.push(`<div style="background:${on?'#141416':'#fff'}"></div>`);
  }
  return out.join('');
}

};

    { name:'Northern Static', venue:'The Foundry', time:'20:00', seats:'Standing · 1 ticket', m:'DEC', d:'3', wd:'Thu', bg:'#141416', fg:'#F2D64B' },

  ];
  if (state.order) upcoming.unshift({ name:'Low Tide Orchestra', venue:'Riverside Hall', time:'19:30', seats: state.order.seats.map(s=>`${s.tier.name} ${s.row}${s.num}`).join(', '), m:'NOV', d:'20', wd:'Fri', bg:'#FF5B22', fg:'#141416', mine:true });

      <h1 style="font-weight:800;font-size:56px;letter-spacing:-.035em;line-height:1">My tickets</h1>
      <div class="pills" role="tablist" aria-label="Ticket list">
        <button role="tab" class="${up?'on':''}" aria-selected="${up}" data-tab="up">Upcoming</button>
        <button role="tab" class="${!up?'on':''}" aria-selected="${!up}" data-tab="past">Past</button>
      </div>
    </div>
    <ul class="tl">${list.map(t => `<li>
      <div class="date" style="background:${t.bg};color:${t.fg}"><span class="mono" style="font-size:13px;letter-spacing:.12em">${t.m}</span><span style="font-family:var(--display);font-weight:800;font-size:48px;line-height:1">${t.d}</span><span style="font-size:13px">${t.wd}</span></div>
      <div style="flex:999 1 300px;min-width:0;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px"><span style="font-family:var(--display);font-weight:700;font-size:24px">${t.name}</span><span class="muted" style="font-size:15px">${t.venue} · ${t.time}</span><span style="font-size:15px">${t.seats}</span></div>
      <div style="flex:1 1 220px;padding:22px 26px;display:flex;align-items:center;justify-content:flex-end;gap:14px;border-left:2px dashed #E1DFD7">
        <span class="status" style="${up?'background:#E3F2EA;color:#1E5B3F':'background:#E8E6DF;color:#5E5E66'}">${up?'Ready':'Attended'}</span>
        ${up && t.mine ? '<a class="btn btn-ink" style="height:46px;font-size:15px" href="#/confirmation">View ticket</a>' : ''}
      </div></li>`).join('')}
    </ul>
  </main>`;
};

pages.admin = () => `<div class="admin">
  <nav class="admin-nav" aria-label="Admin">
    <a class="logo" href="#/home" style="color:var(--paper);padding:0 8px">${icon.logo('#FF5B22',24)}<span style="color:var(--paper);font-size:24px">ushr</span><span class="mono" style="font-size:11px;padding:3px 6px;border:1px solid #5E5E66;border-radius:4px;color:#C9C7BF">ADMIN</span></a>
    <ul><li><a class="item" href="#/admin">Overview</a></li><li><a class="item on" href="#/admin" aria-current="page">Events</a></li><li><a class="item" href="#/admin">Venues</a></li><li><a class="item" href="#/admin">Orders</a></li></ul>
  </nav>
  <main class="grow" style="padding:36px 40px 72px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px">
      <div><p class="muted" style="margin:0;font-size:14px">Events / New</p><h1 style="margin-top:6px;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em">Create an event</h1></div>
      <div style="display:flex;gap:10px"><button class="btn btn-line" style="height:48px">Save draft</button><button class="btn btn-ink" style="height:48px">Put on sale</button></div>

        <div class="grid2">
          <div class="field"><label for="ec">Category</label><select class="input" id="ec"><option>Music</option><option>Comedy</option><option>Theatre</option><option>Sport</option><option>Family</option></select></div>
          <div class="field"><label for="ev">Venue</label><select class="input" id="ev"><option>Riverside Hall</option><option>The Foundry</option><option>Old Tram Depot</option></select></div>
          <div class="field"><label for="ed">Date and time</label><input class="input" id="ed" type="datetime-local"></div>
        </div>
        <div class="field"><label for="desc">Description</label><textarea class="input" id="desc" rows="4"></textarea></div>
      </fieldset>
      <fieldset class="card side" style="display:flex;flex-direction:column;gap:14px">
        <legend>Price tiers</legend>
        <p class="muted" style="margin:0;font-size:14px">Prices apply to each section of the venue’s seat map.</p>
        ${TIERS.map((t,i)=>`<div style="display:flex;align-items:center;gap:12px"><i class="sw" style="background:${t.color}"></i><label for="p${i}" style="flex:1;font-weight:600">${t.name}</label><input class="input" id="p${i}" value="£${t.price}" style="width:96px;height:46px;text-align:right"></div>`).join('')}

    <section style="display:flex;flex-direction:column;gap:14px">
      <h2 style="font-weight:700;font-size:26px">Your events</h2>

        <thead><tr><th scope="col">Event</th><th scope="col">Date</th><th scope="col">Venue</th><th scope="col">Status</th><th scope="col" style="text-align:right">Seats sold</th></tr></thead>
        <tbody>
          <tr><td><b>Low Tide Orchestra</b></td><td>20 Nov 2026</td><td>Riverside Hall</td><td><span class="status" style="background:#E3F2EA;color:#1E5B3F">On sale</span></td><td class="mono" style="text-align:right">[SOLD] / [CAPACITY]</td></tr>
          <tr><td><b>Saturday Science Show</b></td><td>28 Nov 2026</td><td>Riverside Hall</td><td><span class="status" style="background:#E3F2EA;color:#1E5B3F">On sale</span></td><td class="mono" style="text-align:right">[SOLD] / [CAPACITY]</td></tr>
          <tr><td><b>Winter Lights Choir</b></td><td>12 Dec 2026</td><td>Old Tram Depot</td><td><span class="status" style="background:#E8E6DF;color:#5E5E66">Draft</span></td><td class="mono" style="text-align:right">—</td></tr>

/* ---------- checkout timer ---------- */
function tick(){
  const left = Math.max(0, Math.round((state.holdEnds - Date.now()) / 1000));
  const banner = $('#banner'); if (!banner) return;
  const m = Math.floor(left/60), s = left%60;
  $('#clock').textContent = left ? `${m}:${String(s).padStart(2,'0')}` : '';
  const urgent = left > 0 && left <= 120;
  banner.style.background = !left ? '#CFCDC4' : urgent ? '#141416' : '#FF5B22';
  banner.style.color = urgent ? '#F4F3EE' : '#141416';
  $('#bannerText').textContent = !left ? 'Your hold has expired and the seats are back on sale.'
    : urgent ? 'Less than 2 minutes left on your seats' : `Your ${state.selected.length} seat${state.selected.length>1?'s are':' is'} held for you`;
  if (!left) {
    $('#again').style.display = 'inline-flex';
    const b = $('#payBtn'); b.disabled = true; b.className = 'btn btn-off block'; b.textContent = 'Hold expired';
    clearInterval(timer);
  }
}

/* ---------- router ---------- */
function render(){
  clearInterval(timer);
  const route = currentRoute;
  const page = pages[route] || pages.login;
  $('#app').innerHTML = page();
  document.querySelectorAll('#screens button').forEach(b => {
    const on = b.dataset.go === route;
    b.classList.toggle('on', on);
    b.setAttribute('aria-current', on ? 'page' : 'false');
  });
  document.title = 'Ushr — ' + ({login:'Sign in',home:'Discover events',event:'Low Tide Orchestra',seats:'Choose your seats',checkout:'Checkout',confirmation:'You’re in',tickets:'My tickets',admin:'Admin'}[route] || 'Sign in');
  if (route === 'checkout' && state.holdEnds) { tick(); timer = setInterval(tick, 1000); }
}
function rerender(){ const y = window.scrollY || 0; render(); try { scrollTo(0, y); } catch (e) {} }

window.addEventListener('hashchange', () => {
  const r = location.hash.replace('#/','').split('?')[0];
  if (ROUTES.includes(r) && r !== currentRoute) go(r);
});

document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#/"], [data-go]');
  if (link) {
    e.preventDefault();
    go(link.dataset.go || link.getAttribute('href').slice(2));
    return;
  }
  const t = e.target.closest('[data-auth],[data-cat],[data-seat],[data-remove],[data-tab],#hold');
  if (!t) return;
  if (t.dataset.auth) { state.authMode = t.dataset.auth; return rerender(); }
  if (t.dataset.cat) { state.cat = t.dataset.cat; return rerender(); }
  if (t.dataset.tab) { state.ticketsTab = t.dataset.tab; return rerender(); }
  if (t.dataset.seat || t.dataset.remove) {
    const id = t.dataset.seat || t.dataset.remove;
    if (state.selected.includes(id)) { state.selected = state.selected.filter(s => s !== id); state.limitHit = false; }
    else if (state.selected.length >= MAX) { state.limitHit = true; }
    else { state.selected = [...state.selected, id]; state.limitHit = false; }
    return rerender();
  }
  if (t.id === 'hold') { state.holdEnds = Date.now() + HOLD_SECONDS * 1000; go('checkout'); }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'auth') { e.preventDefault(); go('home'); }
  if (e.target.id === 'pay') {
    e.preventDefault();
    const ref = 'USH-' + Math.random().toString(36).slice(2,6).toUpperCase() + '-' + String(Math.floor(1000 + Math.random()*9000));
    state.order = { ref, seats: selectedSeats() };
    state.holdEnds = null;
    go('confirmation');
  }
});

render();
</script>
